<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Clickable prototype of the NYC Pickup Soccer redesign (Matchday Line): game search, game status, field pages, player profile and the player pages." />
    <script>
      // Apply the saved theme before the page paints (see src/lib/theme.js).
      (function () {
        var t = 'system';
        try { t = localStorage.getItem('theme') || t; } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = 'system';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>NYC Pickup Soccer · Prototype</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
